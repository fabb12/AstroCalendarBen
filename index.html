<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroCalendario di Ben</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Tailwind CSS per la grafica -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Astronomy Engine per calcolare gli eventi -->
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
  
  <!-- FullCalendar per il calendario a griglia -->
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>

  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
  
  <header class="max-w-4xl mx-auto mb-8 text-center">
    <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 mb-2">AstroCalendario di Ben</h1>
    <p class="text-slate-400">Calcolo eventi in tempo reale fino al 2070</p>
    
    <div class="mt-6 flex justify-center gap-4">
      <!-- Pulsanti per cambiare vista -->
      <button id="btn-vista-calendario" class="px-5 py-2 rounded-full font-semibold transition-colors bg-blue-600 hover:bg-blue-500 text-white shadow-lg">📅 Mese</button>
      <button id="btn-vista-agenda" class="px-5 py-2 rounded-full font-semibold transition-colors bg-slate-700 hover:bg-slate-600 text-white">📜 Agenda</button>
      <button id="btn-aggiungi" class="px-5 py-2 rounded-full font-semibold transition-colors bg-green-600 hover:bg-green-500 text-white shadow-lg" title="Aggiungi un evento manuale">➕ Aggiungi</button>
      <button id="btn-notifiche" class="px-5 py-2 rounded-full font-semibold transition-colors border border-blue-500 text-blue-400 hover:bg-blue-900" title="Attiva Notifiche">🔔</button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto">
    
    <!-- VISTA CALENDARIO A GRIGLIA -->
    <div id="vista-calendario" class="bg-slate-800 p-4 md:p-6 rounded-2xl border border-slate-700 shadow-xl">
      <div id="calendario-griglia"></div>
    </div>

    <!-- VISTA AGENDA A LISTA -->
    <div id="vista-agenda" class="hidden grid gap-6">
      <div class="text-center text-slate-400 italic mb-2" id="loading-msg">Calcolo orbite in corso...</div>
      <div id="eventi-container" class="grid gap-6"></div>
    </div>

  </main>

  <!-- MODALE: FORM AGGIUNGI EVENTO MANUALE -->
  <div id="modale-aggiungi" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-start md:items-center justify-center p-4 overflow-y-auto">
    <div class="bg-slate-800 w-full max-w-lg rounded-2xl border border-slate-700 shadow-2xl my-8">
      <div class="flex justify-between items-center p-5 border-b border-slate-700">
        <h2 class="text-2xl font-bold text-white">➕ Nuovo Evento</h2>
        <button id="btn-chiudi-modale" class="p-2 text-slate-400 hover:text-white text-2xl leading-none" title="Chiudi">✕</button>
      </div>

      <form id="form-evento" class="p-5 space-y-4">
        <div>
          <label for="ev-titolo" class="block text-sm font-semibold text-slate-300 mb-1">Titolo *</label>
          <input id="ev-titolo" type="text" required maxlength="120"
            class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500"
            placeholder="Es. Osservazione al parco">
        </div>

        <div>
          <label for="ev-data" class="block text-sm font-semibold text-slate-300 mb-1">Data e ora *</label>
          <input id="ev-data" type="datetime-local" required
            class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label for="ev-colore" class="block text-sm font-semibold text-slate-300 mb-1">Colore</label>
          <input id="ev-colore" type="color" value="#3b82f6"
            class="w-16 h-10 bg-slate-900 border border-slate-600 rounded-lg cursor-pointer">
        </div>

        <div>
          <label for="ev-spiegazione" class="block text-sm font-semibold text-slate-300 mb-1">Cosa succede</label>
          <textarea id="ev-spiegazione" rows="3" maxlength="600"
            class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500"
            placeholder="Descrivi l'evento..."></textarea>
        </div>

        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-3">
          <h3 class="font-bold text-white text-sm">🎒 Programma (facoltativo)</h3>
          <div>
            <label for="ev-portare" class="block text-xs font-semibold text-slate-400 mb-1">Cosa portare</label>
            <input id="ev-portare" type="text" maxlength="200"
              class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label for="ev-dove" class="block text-xs font-semibold text-slate-400 mb-1">Dove vederlo</label>
            <input id="ev-dove" type="text" maxlength="200"
              class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label for="ev-come" class="block text-xs font-semibold text-slate-400 mb-1">Come vederlo</label>
            <input id="ev-come" type="text" maxlength="200"
              class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="submit" class="flex-1 px-5 py-2 rounded-full font-semibold bg-green-600 hover:bg-green-500 text-white shadow-lg transition-colors">Salva evento</button>
          <button type="button" id="btn-annulla" class="px-5 py-2 rounded-full font-semibold bg-slate-700 hover:bg-slate-600 text-white transition-colors">Annulla</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

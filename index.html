<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroCal 2070</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
  <header class="max-w-3xl mx-auto mb-8 text-center">
    <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 mb-2">AstroCalendario</h1>
    <p class="text-slate-400">Esplora il cosmo fino al 2070</p>
    <button id="btn-notifiche" class="mt-4 px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-full text-sm font-semibold transition-colors">
      🔔 Attiva Notifiche
    </button>
  </header>

  <main id="eventi-container" class="max-w-3xl mx-auto grid gap-6">
    <!-- Le card degli eventi verranno generate qui dal Javascript -->
  </main>

  <script src="app.js"></script>
</body>
</html>

name: Verifica Missione Cielo
on:
  pull_request:
    paths:
      - '*.js'
      - 'lingue/**'
      - 'style.css'
      - 'index.html'
      - 'scripts/prova-missione*.js'
      - 'scripts/prova-rilievo-zoom.js'
      - 'scripts/prova-inseguimento.js'
      - '.github/workflows/verifica-missione.yml'
permissions:
  contents: read
jobs:
  missione:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2 astronomy-engine@2.1.19
      - run: npx playwright install --with-deps chromium
      - run: node scripts/controlla-collisioni.js
      - run: node scripts/prova-abitati.js
      - run: node scripts/prova-missione-stati.js
      - run: node scripts/prova-missione.js
      - run: node scripts/prova-missione-interattiva.js
        if: success() || failure()
      # Il rilievo a campo stretto, nei pixel: è l'unico posto in cui i
      # rettangoli verticali dello zoom si possono vedere, e una prova che
      # gira solo a mano è una prova che fra un mese nessuno lancia più.
      - run: node scripts/prova-rilievo-zoom.js
        if: success() || failure()
      # L'inseguimento degli aerei nella realtà aumentata. Mezzo secondo,
      # senza browser: il flusso ottico, il rivelatore, il filtro e la
      # pipeline intera si provano su scene sintetiche di cui si conosce la
      # verità. È la famiglia in cui un difetto **non fallisce** — un
      # riquadro che deriva è un riquadro, e sullo schermo si legge come
      # giusto — quindi una prova che gira solo a mano è una prova che fra un
      # mese nessuno lancia più.
      - run: node scripts/prova-inseguimento.js
        if: success() || failure()
      # L'allineamento a mano della realtà aumentata e le sue etichette
      # (`visione.js` §12 e §13): i conti senza browser — il dito porta
      # l'oggetto sotto di sé e tutto il cielo con lui, e girando il telefono
      # resta lì — e poi il percorso vero dell'interfaccia in un Chromium,
      # su un telefono dritto, uno girato e un computer.
      - run: node scripts/prova-ar-calibrazione.js
        if: success() || failure()
      - run: node scripts/prova-ar-browser.js
        if: success() || failure()

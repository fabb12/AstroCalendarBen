name: Verifica Demo
on:
  pull_request:
    paths:
      - 'demo*.js'
      - 'narrazione.js'
      - 'missione-cielo.js'
      - 'audio/narrazione/**'
      - 'sw.js'
      - 'scripts/*narrazione*.js'
      - 'didattica.js'
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'lingue/*.js'
      - 'scripts/prova-demo*.js'
      - 'scripts/prova-musica.js'
      - 'musica/**'
      - '.github/workflows/verifica-demo.yml'
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/prova-demo.js
      - run: node scripts/prova-musica.js
      - run: node scripts/prova-narrazione.js
      - run: node scripts/controlla-narrazione.js
      - run: node scripts/prova-i18n.js
      - run: npm install --no-save --package-lock=false playwright@1.58.2 astronomy-engine@2.1.19 satellite.js@5.0.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/prova-demo-browser.js
      - run: node scripts/prova-demo-regia.js
      - run: node scripts/prova-demo-pagina.js
        if: success() || failure()
      - run: node scripts/prova-demo-intro.js
        if: success() || failure()
      - run: node scripts/prova-narrazione-browser.js
        if: success() || failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-eclisse
          path: |
            work/demo-*.png
            work/regia-*.png
            work/intro-*.png
            work/aurora-*.png
          if-no-files-found: ignore

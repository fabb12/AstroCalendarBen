<div class="riga-comandi riga-cerca-luogo" data-solo-cielo>
  <input id="skymap-luogo-cerca" type="search" class="campo-cielo" autocomplete="off"
    placeholder="Guarda il cielo da un'altra città…"
    aria-label="Cerca la città da cui guardare il cielo"
    title="Scrivi il nome di una città: il cielo si sposta lì, ma solo qui nel planetario">
  <button id="skymap-luogo-attuale" type="button" class="tasto-cielo tasto-luogo-mappa"
    title="Torna alla tua posizione attuale">Posizione attuale</button>
  <button id="skymap-luogo-mappa" type="button" class="tasto-cielo tasto-luogo-mappa"
    title="Scegli il punto sul mappamondo: va bene anche un posto che non ha un nome da cercare">Sulla mappa</button>
</div>
